<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NZ Love Calculator 💚</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0a0f0a;
      --green-dark: #1a3d1f;
      --green-mid: #2d6a35;
      --green-bright: #3dba52;
      --green-glow: #5fe87a;
      --silver: #c8d8c9;
      --white: #f0f7f1;
      --fern: #4a7c59;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--black);
      color: var(--white);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated fern/koru background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(45,106,53,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 20%, rgba(26,61,31,0.22) 0%, transparent 55%),
        radial-gradient(ellipse 100% 100% at 50% 50%, rgba(10,15,10,1) 60%, transparent 100%);
      z-index: 0;
      pointer-events: none;
    }

    /* SVG koru pattern overlay */
    .bg-koru {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      opacity: 0.06;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 60px;
    }

    .nz-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(61,186,82,0.12);
      border: 1px solid rgba(61,186,82,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--green-bright);
      margin-bottom: 24px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.8rem, 7vw, 4.4rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--white);
      margin-bottom: 8px;
    }

    h1 em {
      font-style: italic;
      color: var(--green-bright);
    }

    .subtitle {
      font-size: 1rem;
      color: var(--silver);
      font-weight: 300;
      margin-top: 14px;
      letter-spacing: 0.01em;
    }

    /* Card */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(61,186,82,0.15);
      border-radius: 24px;
      padding: 48px 40px;
      backdrop-filter: blur(12px);
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -1px; left: 50%; transform: translateX(-50%);
      width: 60%;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--green-bright), transparent);
    }

    /* Inputs */
    .field {
      margin-bottom: 28px;
    }

    .field label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-bright);
      margin-bottom: 10px;
    }

    .field label span {
      opacity: 0.6;
      font-size: 0.7rem;
      margin-left: 6px;
      text-transform: none;
      letter-spacing: 0;
    }

    .field input {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1.05rem;
      color: var(--white);
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
    }

    .field input::placeholder { color: rgba(255,255,255,0.25); }

    .field input:focus {
      border-color: var(--green-bright);
      background: rgba(61,186,82,0.06);
      box-shadow: 0 0 0 3px rgba(61,186,82,0.1);
    }

    /* Divider hearts */
    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 10px 0 28px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.07);
    }
    .divider span {
      font-size: 1.1rem;
      opacity: 0.5;
    }

    /* Compatibility options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 32px;
    }

    .option-card {
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--silver);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.82rem;
      text-align: left;
      position: relative;
    }

    .option-card:hover { border-color: var(--green-mid); }

    .option-card.active {
      border-color: var(--green-bright);
      background: rgba(61,186,82,0.08);
      color: var(--white);
    }

    .option-card .icon { font-size: 1.2rem; margin-bottom: 4px; display: block; }
    .option-card .label { font-weight: 500; display: block; }
    .option-card .desc { font-size: 0.72rem; opacity: 0.6; margin-top: 2px; display: block; }

    .options-label {
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-bright);
      margin-bottom: 12px;
    }

    /* Button */
    .btn-calculate {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, var(--green-mid), var(--green-bright));
      border: none;
      border-radius: 14px;
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem;
      font-style: italic;
      color: #fff;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, filter 0.2s;
      box-shadow: 0 4px 24px rgba(61,186,82,0.3);
      position: relative;
      overflow: hidden;
    }

    .btn-calculate::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15), transparent);
    }

    .btn-calculate:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(61,186,82,0.45);
      filter: brightness(1.08);
    }

    .btn-calculate:active { transform: translateY(0); }

    /* Result */
    .result {
      margin-top: 40px;
      text-align: center;
      display: none;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-names {
      font-size: 0.85rem;
      color: var(--silver);
      margin-bottom: 16px;
      letter-spacing: 0.05em;
    }

    .result-names strong { color: var(--white); }

    .score-ring {
      width: 160px;
      height: 160px;
      margin: 0 auto 20px;
      position: relative;
    }

    .score-ring svg { transform: rotate(-90deg); }
    .score-ring .bg-circle { fill: none; stroke: rgba(255,255,255,0.06); stroke-width: 10; }
    .score-ring .fg-circle {
      fill: none;
      stroke: var(--green-bright);
      stroke-width: 10;
      stroke-linecap: round;
      stroke-dasharray: 408;
      stroke-dashoffset: 408;
      transition: stroke-dashoffset 1.4s cubic-bezier(0.22,1,0.36,1);
      filter: drop-shadow(0 0 8px var(--green-glow));
    }

    .score-label {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .score-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 700;
      color: var(--white);
      line-height: 1;
    }

    .score-pct { font-size: 1rem; color: var(--green-bright); }

    .result-verdict {
      font-family: 'Playfair Display', serif;
      font-size: 1.5rem;
      font-style: italic;
      color: var(--white);
      margin-bottom: 12px;
    }

    .result-message {
      font-size: 0.92rem;
      color: var(--silver);
      line-height: 1.65;
      max-width: 420px;
      margin: 0 auto 24px;
    }

    .result-traits {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 24px;
    }

    .trait-pill {
      background: rgba(61,186,82,0.1);
      border: 1px solid rgba(61,186,82,0.25);
      border-radius: 100px;
      padding: 5px 14px;
      font-size: 0.78rem;
      color: var(--green-glow);
    }

    .btn-reset {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 10px 24px;
      color: var(--silver);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .btn-reset:hover { border-color: var(--green-bright); color: var(--white); }

    /* Stars */
    .stars {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 16px;
    }
    .star { font-size: 1.1rem; opacity: 0; animation: popStar 0.3s ease both; }
    @keyframes popStar { to { opacity: 1; transform: scale(1.2); } from { opacity: 0; transform: scale(0.5); } }

    /* Footer */
    footer {
      text-align: center;
      margin-top: 48px;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.2);
      letter-spacing: 0.05em;
    }

    footer a { color: rgba(61,186,82,0.5); text-decoration: none; }

    /* Loading shimmer */
    .loading {
      display: none;
      text-align: center;
      padding: 20px 0;
    }

    .shimmer-bar {
      height: 8px;
      border-radius: 100px;
      background: linear-gradient(90deg, rgba(61,186,82,0.1) 25%, rgba(61,186,82,0.3) 50%, rgba(61,186,82,0.1) 75%);
      background-size: 200%;
      animation: shimmer 1.2s infinite;
      margin: 8px auto;
    }
    .shimmer-bar:nth-child(1) { width: 80%; }
    .shimmer-bar:nth-child(2) { width: 60%; animation-delay: 0.15s; }
    .shimmer-bar:nth-child(3) { width: 70%; animation-delay: 0.3s; }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .loading p {
      font-style: italic;
      color: var(--green-bright);
      font-family: 'Playfair Display', serif;
      font-size: 0.95rem;
      margin-bottom: 16px;
    }

    @media (max-width: 520px) {
      .card { padding: 32px 20px; }
      .options-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<!-- Koru SVG Background -->
<svg class="bg-koru" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#3dba52" stroke-width="1.5">
    <path d="M100,600 Q100,400 300,400 Q500,400 500,200 Q500,50 350,50 Q200,50 200,200 Q200,300 300,300 Q370,300 370,220" />
    <path d="M600,700 Q600,500 750,480 Q900,460 880,320 Q860,200 740,210 Q650,220 670,320 Q685,390 760,380" />
    <circle cx="300" cy="300" r="30" />
    <circle cx="760" cy="380" r="22" />
  </g>
</svg>

<div class="container">
  <header>
    <div class="nz-badge">🌿 Aotearoa · New Zealand</div>
    <h1>NZ <em>Love</em><br>Calculator</h1>
    <p class="subtitle">Discover your romantic compatibility — crafted with Kiwi spirit</p>
  </header>

  <div class="card">
    <div class="field">
      <label>Your Name <span>First & last</span></label>
      <input type="text" id="name1" placeholder="e.g. Aroha Williams" autocomplete="off" />
    </div>

    <div class="divider"><span>💚</span></div>

    <div class="field">
      <label>Their Name <span>First & last</span></label>
      <input type="text" id="name2" placeholder="e.g. Tama Ngāti" autocomplete="off" />
    </div>

    <div class="options-label">Compatibility Style</div>
    <div class="options-grid" id="modeGrid">
      <button class="option-card active" data-mode="classic">
        <span class="icon">💌</span>
        <span class="label">Classic</span>
        <span class="desc">Traditional love score</span>
      </button>
      <button class="option-card" data-mode="soulmate">
        <span class="icon">✨</span>
        <span class="label">Soulmate</span>
        <span class="desc">Deep spiritual bond</span>
      </button>
      <button class="option-card" data-mode="adventure">
        <span class="icon">🏔️</span>
        <span class="label">Adventure</span>
        <span class="desc">NZ outdoor spirit</span>
      </button>
      <button class="option-card" data-mode="future">
        <span class="icon">🌏</span>
        <span class="label">Future</span>
        <span class="desc">Long-term potential</span>
      </button>
    </div>

    <button class="btn-calculate" id="calcBtn" onclick="calculate()">
      Calculate Your Love ✦
    </button>

    <!-- Loading -->
    <div class="loading" id="loading">
      <p>Reading the stars over Aotearoa…</p>
      <div class="shimmer-bar"></div>
      <div class="shimmer-bar"></div>
      <div class="shimmer-bar"></div>
    </div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-names" id="resultNames"></div>
      <div class="score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="bg-circle" cx="80" cy="80" r="65"/>
          <circle class="fg-circle" id="scoreCircle" cx="80" cy="80" r="65"/>
        </svg>
        <div class="score-label">
          <div class="score-number" id="scoreNumber">0</div>
          <div class="score-pct">%</div>
        </div>
      </div>
      <div class="stars" id="starsRow"></div>
      <div class="result-verdict" id="verdict"></div>
      <div class="result-message" id="message"></div>
      <div class="result-traits" id="traits"></div>
      <button class="btn-reset" onclick="reset()">Try Another Pair 🌿</button>
    </div>
  </div>

  <footer>
    NZ Love Calculator &copy; 2026 &mdash; Made with 💚 in Aotearoa
  </footer>
</div>

<script>
  let selectedMode = 'classic';

  // Mode selection
  document.getElementById('modeGrid').addEventListener('click', e => {
    const card = e.target.closest('.option-card');
    if (!card) return;
    document.querySelectorAll('.option-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    selectedMode = card.dataset.mode;
  });

  // Algorithm: deterministic but looks fun
  function computeScore(a, b, mode) {
    const str = (a + b + mode).toLowerCase().replace(/\s/g,'');
    let hash = 5381;
    for (let i = 0; i < str.length; i++) hash = ((hash << 5) + hash) + str.charCodeAt(i);
    hash = Math.abs(hash);

    const modifiers = { classic: 0, soulmate: 7, adventure: -5, future: 3 };
    let base = (hash % 71) + 20; // 20–90
    base = Math.min(99, Math.max(10, base + (modifiers[mode] || 0)));
    return base;
  }

  const verdicts = {
    high:   ["A Kiwi Fairytale", "Meant to Be", "Pure Magic", "Stars Aligned"],
    mid:    ["Worth Exploring", "Beautiful Potential", "Growing Together", "A Lovely Journey"],
    low:    ["Challenging but Possible", "Different Paths", "Keep an Open Heart", "A Gentle Adventure"]
  };

  const messages = {
    high: [
      "Like the silver fern reaching for the light — your love grows strong and true. The universe has spoken, and it sounds like 'kia ora!'",
      "From the Bay of Islands to Fiordland, nature has conspired to bring two perfectly matched souls together. Cherish this bond."
    ],
    mid: [
      "Like a Kiwi trail — it takes effort, but the view at the top is breathtaking. Your connection has real promise.",
      "Every great love story in Aotearoa starts with curiosity. You two have beautiful potential waiting to bloom."
    ],
    low: [
      "Sometimes the most unexpected combinations create the most memorable adventures. Keep an open heart and see where the wind takes you.",
      "Love, like New Zealand's weather, can surprise you. Don't write this chapter too quickly."
    ]
  };

  const traitSets = {
    high: [['Deeply Connected','Harmonious','Adventurous','Devoted','Magnetic'],
           ['Soulbound','Radiant','Complementary','Joyful','Timeless']],
    mid:  [['Intriguing','Growing','Warm','Curious','Hopeful'],
           ['Promising','Gentle','Spirited','Open','Sincere']],
    low:  [['Free-spirited','Independent','Unique','Honest','Complex'],
           ['Authentic','Bold','Different','Real','Grounded']]
  };

  function getCategory(score) {
    if (score >= 70) return 'high';
    if (score >= 40) return 'mid';
    return 'low';
  }

  function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

  async function calculate() {
    const n1 = document.getElementById('name1').value.trim();
    const n2 = document.getElementById('name2').value.trim();
    if (!n1 || !n2) {
      document.getElementById('name1').focus();
      return;
    }

    document.getElementById('result').style.display = 'none';
    document.getElementById('loading').style.display = 'block';
    document.getElementById('calcBtn').disabled = true;

    await new Promise(r => setTimeout(r, 1600));

    const score = computeScore(n1, n2, selectedMode);
    const cat = getCategory(score);

    document.getElementById('loading').style.display = 'none';
    document.getElementById('calcBtn').disabled = false;

    // Set content
    document.getElementById('resultNames').innerHTML =
      `<strong>${n1}</strong> &amp; <strong>${n2}</strong>`;
    document.getElementById('scoreNumber').textContent = score;
    document.getElementById('verdict').textContent = pickRandom(verdicts[cat]);
    document.getElementById('message').textContent = pickRandom(messages[cat]);

    // Traits
    const traitList = pickRandom(traitSets[cat]);
    document.getElementById('traits').innerHTML = traitList
      .map(t => `<span class="trait-pill">${t}</span>`).join('');

    // Stars
    const stars = score >= 70 ? 5 : score >= 50 ? 4 : score >= 35 ? 3 : 2;
    document.getElementById('starsRow').innerHTML = Array.from({length:5}, (_,i) =>
      `<span class="star" style="animation-delay:${i*0.1}s;opacity:${i<stars?1:0.2}">${i<stars?'⭐':'☆'}</span>`
    ).join('');

    // Animate ring
    const circumference = 408;
    const offset = circumference - (score / 100) * circumference;
    document.getElementById('result').style.display = 'block';
    requestAnimationFrame(() => {
      document.getElementById('scoreCircle').style.strokeDashoffset = offset;
      // Color based on score
      const color = score >= 70 ? '#5fe87a' : score >= 40 ? '#f0c040' : '#e87a5f';
      document.getElementById('scoreCircle').style.stroke = color;
    });

    // Animate number
    let current = 0;
    const timer = setInterval(() => {
      current += Math.ceil((score - current) / 8);
      if (current >= score) { current = score; clearInterval(timer); }
      document.getElementById('scoreNumber').textContent = current;
    }, 40);
  }

  function reset() {
    document.getElementById('result').style.display = 'none';
    document.getElementById('name1').value = '';
    document.getElementById('name2').value = '';
    document.getElementById('scoreCircle').style.strokeDashoffset = 408;
    document.getElementById('name1').focus();
  }

  // Enter key support
  ['name1','name2'].forEach(id => {
    document.getElementById(id).addEventListener('keydown', e => {
      if (e.key === 'Enter') calculate();
    });
  });
</script>
</body>
</html>
